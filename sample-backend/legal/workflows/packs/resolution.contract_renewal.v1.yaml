id: resolution.contract_renewal
version: 1
status: active
jurisdiction: lavalleja
intent: {family: resolution_drafting, subtype: contract_renewal}
precedent_types: [adjudicacion_licitacion, aprobacion_convenio]
fields:
  - {key: expediente, label: Expediente, field_type: text, required: true, origin: workflow, reason: Identifica las actuaciones., validation_rules: {min_length: 1}}
  - {key: contract_object, label: Objeto del contrato, field_type: textarea, required: true, origin: workflow, reason: Delimita la renovacion solicitada., validation_rules: {min_length: 3}}
  - {key: contractor, label: Contratista y RUT, field_type: text, required: true, origin: workflow, reason: Identifica a la contraparte., validation_rules: {min_length: 3}}
  - {key: original_contract, label: Contrato y procedimiento original, field_type: document_reference, required: true, origin: workflow, reason: Permite verificar el antecedente contractual., validation_rules: {min_length: 1}}
  - {key: current_end_date, label: Vencimiento actual, field_type: date, required: true, origin: workflow, reason: Permite controlar la cronologia., validation_rules: {}}
  - {key: proposed_end_date, label: Vencimiento propuesto, field_type: date, required: true, origin: workflow, reason: Define el periodo solicitado., validation_rules: {after: current_end_date}}
  - {key: amount, label: Importe de la renovacion, field_type: currency, required: true, origin: workflow, reason: Permite controles deterministas del importe., validation_rules: {min: '0'}}
  - {key: budget_report, label: Informe o disponibilidad presupuestal, field_type: document_reference, required: true, origin: workflow, reason: Documenta el respaldo presupuestal alegado., validation_rules: {min_length: 1}}
  - {key: technical_report, label: Informe tecnico de necesidad, field_type: document_reference, required: true, origin: workflow, reason: Documenta la motivacion administrativa., validation_rules: {min_length: 1}}
legal_issues: [competence, renewal_permitted, maximum_duration, procurement_route, budget_credit, provider_compliance, required_reports, formal_requirements]
required_sections: [vistos, resultandos, considerandos, legal_basis, operative_articles, notifications]
require_verified_competence: true
